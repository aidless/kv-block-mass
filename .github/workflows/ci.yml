name: ci

# CPU only. This workflow does not run bench/bench_block_mass.py and does not
# install a CUDA or ROCm wheel. GPU numbers in the README are checked against
# committed bench JSON by scripts/check_readme_drift.py. They are not re-measured.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpu-tests:
    name: cpu tests, no GPU bench (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # CPU wheels only. GPU tests are skipif and are not executed here.
      # Triton is installed so the kernel module imports. Nothing launches it.
      - name: install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"
          pip install pytest
          pip install triton
          pip install -e .

      - name: drift check (README vs committed JSON, no GPU)
        run: python scripts/check_readme_drift.py

      - name: reference + structural tests
        run: pytest tests/ -q

      - name: mutation gate (inject bugs, require all caught)
        run: python tests/mutation_gate.py

      - name: mutation gate (policy / certificate / ledger)
        run: python tests/mutation_gate_evict.py

      - name: package imports cleanly
        run: |
          python -c "import kvblockmass, kvblockmass.reference; print(kvblockmass.__version__)"
          python -c "import kvblockmass.evict, kvblockmass.certificate, kvblockmass.budget, kvblockmass.reclaim; print('layers ok')"

      - name: end-to-end example
        run: python examples/policy_card.py
